<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rural Tech - Editar Perfil</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/editar_perfil.css">

</head>

<body>

    <!-- MENU LATERAL -->

    <nav class="menu-lateral">

        <div class="menu-topo">

            <img src="../img/logotcc.png" alt="Logo Rural Tech">

            <span>Rural Tech</span>

        </div>

        <ul>

            <li>
                <a href="inicio.html">
                    <i class="fa-solid fa-house"></i>
                    <span>Início</span>
                </a>
            </li>

            <li>
                <a href="produtos.html">
                    <i class="fa-solid fa-box"></i>
                    <span>Produtos</span>
                </a>
            </li>

            <li>
                <a href="producao.html">
                    <i class="fa-solid fa-seedling"></i>
                    <span>Produção</span>
                </a>
            </li>

            <li>
                <a href="comercial.html">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Comercial</span>
                </a>
            </li>

            <li>
                <a href="relatorios.html">
                    <i class="fa-solid fa-chart-column"></i>
                    <span>Relatórios</span>
                </a>
            </li>

            <li>
                <a href="consulta.html">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span>Consulta</span>
                </a>
            </li>

            <li>
                <a href="configuracoes.html" class="ativo">
                    <i class="fa-solid fa-gear"></i>
                    <span>Configurações</span>
                </a>
            </li>

        </ul>

    </nav>

    <div class="fundo-menu"></div>


    <!-- CABEÇALHO -->

    <header>

        <button class="menu-btn" id="menuBtn">
            <i class="fa-solid fa-bars"></i>
        </button>

        <img src="../img/logotcc.png" alt="Logo Rural Tech">

        <h2>Rural Tech</h2>

    </header>


    <!-- CONTEÚDO -->

    <main>

        <section class="cabecalho-pagina">

            <span class="subtitulo">CONFIGURAÇÕES</span>

            <h1>Editar perfil</h1>

            <p>
                Atualize suas informações pessoais.
            </p>

        </section>


        <section class="perfil-card">

            <div class="titulo-card">

                <div class="icone-perfil">
                    <i class="fa-solid fa-user"></i>
                </div>

                <div>
                    <h2>Informações do perfil</h2>

                    <p>
                        Altere os dados da sua conta.
                    </p>
                </div>

            </div>


            <form id="formPerfil">

                <div class="campo">

                    <label for="nome">Nome</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="telefone">Telefone</label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="Digite seu telefone"
                    >

                </div>


                <div class="botoes">

                    <a href="configuracoes.html" class="btn-cancelar">
                        Cancelar
                    </a>

                    <button type="submit" class="btn-salvar">

                        <i class="fa-solid fa-check"></i>

                        Salvar alterações

                    </button>

                </div>

            </form>

        </section>

    </main>


    <script src="../js/menu_lateral.js"></script>
    <script src="../js/editar_perfil.js"></script>

</body>

</html>
